[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hail-agent"
version = "0.3.0"
description = "Talk to your AI agents (Hermes, OpenClaw, Claude Code, anything) from the terminal or any MCP client, locally or over SSH."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "kerneldottoday" }]
keywords = ["ai-agents", "mcp", "ssh", "hermes", "openclaw", "claude-code", "cli"]
dependencies = ["tomli>=2; python_version < '3.11'"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/kerneldottoday/hail"
Issues = "https://github.com/kerneldottoday/hail/issues"

[project.scripts]
hail = "hail.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/hail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PLW1510"]
