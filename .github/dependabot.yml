# Pinned actions do not update themselves: Dependabot proposes new SHAs (and keeps the version comment).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # a release must be a week old: time for a hijacked one to be caught
    groups:
      actions:
        patterns: ["*"]
